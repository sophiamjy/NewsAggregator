name: Daily News

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install deps
        run: pip install feedparser deep-translator markdown requests python-dateutil

      - name: Run
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH: ${{ secrets.EMAIL_AUTH }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
        run: python main.py

      - name: Pages
        run: |
          mkdir -p _site
          HTML=$(ls -t 新闻聚合输出/每日中东中亚新闻_*_翻译.html 2>/dev/null | head -1)
          if [ -n "$HTML" ]; then cp "$HTML" _site/index.html; fi

      - name: Deploy to Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HTML=$(ls -t 新闻聚合输出/每日中东中亚新闻_*_翻译.html 2>/dev/null | head -1)
          if [ -z "$HTML" ]; then echo "无HTML文件, 跳过"; exit 0; fi
          cp "$HTML" /tmp/index.html
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages 2>/dev/null || git checkout -b gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet .
          fi
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "Deploy $(date +%Y-%m-%d)" || true
          git push origin gh-pages --force
          git checkout -f master

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 新闻聚合输出/ || true
          if ! git diff --staged --quiet; then
            git commit -m "自动: $(date +%Y-%m-%d)"
            git push
          fi
